name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-main-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source for main
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_REF" == "main" && ( "$HEAD_REF" != "develop" || "$HEAD_REPOSITORY" != "$REPOSITORY" ) ]]; then
            echo "Pull requests into main must come from this repository's develop branch (got: $HEAD_REPOSITORY:$HEAD_REF)."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, enforce coverage, and build
        run: ./gradlew --no-daemon clean check bootJar
      - name: Build container image
        run: docker build --tag vehicle-catalog-api:${{ github.sha }} .
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          if-no-files-found: ignore
          retention-days: 7
