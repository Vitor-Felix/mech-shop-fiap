# Configuração Padrão (Usada no IntelliJ)
spring:
  application:
    name: vehicle-catalog-api
  profiles:
    active: dev

security:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}

vehicle-sales:
  base-url: ${VEHICLE_SALES_BASE_URL:}
  connect-timeout: ${VEHICLE_SALES_CONNECT_TIMEOUT:3s}
  read-timeout: ${VEHICLE_SALES_READ_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
# Perfil DEV: Roda no IntelliJ usando H2 em memória
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:mechshopdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Perfil PROD: Datasource e credenciais são fornecidos pelo ambiente
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driverClassName: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
security:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
