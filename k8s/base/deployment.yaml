apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-catalog-api
  labels:
    app.kubernetes.io/name: vehicle-catalog-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vehicle-catalog-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: vehicle-catalog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vehicle-catalog-api-config
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: vehicle-catalog-api-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vehicle-catalog-api-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vehicle-catalog-api-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vehicle-catalog-api-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vehicle-catalog-api-secrets
                  key: ADMIN_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vehicle-catalog-api-secrets
                  key: JWT_SECRET
            - name: MECH_SHOP_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vehicle-catalog-api-secrets
                  key: MECH_SHOP_INTERNAL_TOKEN
            - name: VEHICLE_SALES_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vehicle-catalog-api-config
                  key: VEHICLE_SALES_BASE_URL
                  optional: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
